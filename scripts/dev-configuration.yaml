# Minimal Home Assistant configuration for scripts/dev-hass.
#
# Deliberately not `default_config:`, which would pip-install dozens of
# unrelated integrations into the test virtualenv. `frontend:` and `config:`
# are what you need to reach Settings -> Devices & services and add the
# integration; `history:` and `logbook:` let you watch entity state over time.
homeassistant:
  name: Mer dev
  unit_system: metric
  time_zone: Europe/London
  currency: GBP
  country: GB

frontend:
config:
http:
history:
logbook:

logger:
  default: warning
  logs:
    custom_components.mer: debug
    # Home Assistant always loads a few default integrations that pull in voice
    # and camera helpers (assist_pipeline, camera). Two of their Python
    # requirements have no prebuilt wheel for this Python and need a C compiler
    # to build, and ffmpeg/turbojpeg are not installed in WSL. The pip build
    # spew and the ffmpeg/turbojpeg tracebacks are silenced here.
    # homeassistant.setup is deliberately left alone: it is what reports a
    # failure in *our* setup. Note that the compiler is not optional: without
    # it the frontend's request for the action list fails (see README,
    # "A C compiler and the Python headers are required in WSL").
    homeassistant.util.package: critical
    haffmpeg: critical
    homeassistant.components.camera.img_util: critical

# Home Assistant's built-in remote-debugging integration. It installs debugpy
# on first start and listens on port 5678, which WSL forwards to Windows, so
# the "Attach to dev Home Assistant" configuration in .vscode/launch.json
# connects with F5. `wait: false` means startup does not block on the IDE.
debugpy:
  start: true
  wait: false
  host: 0.0.0.0
  port: 5678
