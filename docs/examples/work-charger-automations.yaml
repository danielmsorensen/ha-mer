# Work-charger automations for the Mer integration.
#
# Four automations that together do this:
#   1. When you arrive at work and are not charging, tell you which socket is free,
#      preferring Explorer 2 over Explorer 1 and Left over Right, with a "Start" action.
#   2. While you are at work and not charging, tell you when any socket frees up, again
#      offering the best free one with a "Start" action.
#   3. Handle the "Start" tap: press that socket's start button, or say it was taken.
#   4. Report the outcome of every start/stop (charging, ready to plug in, rejected...)
#      and clear the "free charger" notification once you are charging.
#
# Before pasting each one into Settings -> Automations -> Create -> Edit in YAML:
#   - Replace person.YOUR_NAME with your person entity and notify.mobile_app_YOUR_PHONE
#     with your phone's notify service (Developer Tools -> Actions lists it).
#   - Create a zone called "Work" around the car park (Settings -> Areas, labels & zones
#     -> Zones) so zone.work exists.
#   - The entity ids below are what the integration creates for the two NETPark
#     chargers. If yours differ, copy them from Developer Tools -> States.
#
# A start command on a free socket makes the charger wait for the cable, and that wait
# has a timeout the portal does not publish. Tap "Start" when you are at the charger
# with the cable in hand, or plug in first: the button stays available while the socket
# is plugged in and waiting.

# --------------------------------------------------------------------------------------
# 1. Charger free when you arrive at work
# --------------------------------------------------------------------------------------
alias: "Mer: charger free when I arrive at work"
description: On entering the work zone while not charging, offer the best free socket.
triggers:
  - trigger: zone
    entity_id: person.YOUR_NAME
    zone: zone.work
    event: enter
conditions:
  - condition: state
    entity_id: binary_sensor.mer_account_charging
    state: "off"
actions:
  - variables:
      # Preference order: Explorer 2 before Explorer 1, Left before Right.
      candidates:
        - name: Explorer 2 Left
          available: binary_sensor.business_durham_netpark_4_explorer_2_left_available
          start: button.business_durham_netpark_4_explorer_2_left_start_charge
        - name: Explorer 2 Right
          available: binary_sensor.business_durham_netpark_4_explorer_2_right_available
          start: button.business_durham_netpark_4_explorer_2_right_start_charge
        - name: Explorer 1 Left
          available: binary_sensor.business_durham_netpark_3_explorer_1_left_available
          start: button.business_durham_netpark_3_explorer_1_left_start_charge
        - name: Explorer 1 Right
          available: binary_sensor.business_durham_netpark_3_explorer_1_right_available
          start: button.business_durham_netpark_3_explorer_1_right_start_charge
      free: "{{ candidates | selectattr('available', 'is_state', 'on') | list }}"
  - choose:
      - conditions: "{{ free | count > 0 }}"
        sequence:
          - action: notify.mobile_app_YOUR_PHONE
            data:
              title: Charger free at work
              message: >-
                {{ free[0].name }} is free{% if free | count > 1 %}
                ({{ free | count }} sockets free){% endif %}. Start charging?
              data:
                tag: mer_work_charger
                actions:
                  - action: MER_START_CHARGE
                    title: "Start {{ free[0].name }}"
                action_data:
                  start_button: "{{ free[0].start }}"
                  name: "{{ free[0].name }}"
    default:
      - action: notify.mobile_app_YOUR_PHONE
        data:
          title: No charger free at work
          message: All sockets are taken. You will get a notification when one frees up.
          data:
            tag: mer_work_charger
mode: single

---
# --------------------------------------------------------------------------------------
# 2. A socket frees up while you are at work and not charging
# --------------------------------------------------------------------------------------
alias: "Mer: socket freed up while at work"
description: While in the work zone and not charging, offer the best free socket as soon as one frees up.
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.business_durham_netpark_4_explorer_2_left_available
      - binary_sensor.business_durham_netpark_4_explorer_2_right_available
      - binary_sensor.business_durham_netpark_3_explorer_1_left_available
      - binary_sensor.business_durham_netpark_3_explorer_1_right_available
    to: "on"
    # Ignore a socket that is free for only a moment between two cars.
    for: "00:00:30"
conditions:
  - condition: zone
    entity_id: person.YOUR_NAME
    zone: zone.work
  - condition: state
    entity_id: binary_sensor.mer_account_charging
    state: "off"
actions:
  - variables:
      candidates:
        - name: Explorer 2 Left
          available: binary_sensor.business_durham_netpark_4_explorer_2_left_available
          start: button.business_durham_netpark_4_explorer_2_left_start_charge
        - name: Explorer 2 Right
          available: binary_sensor.business_durham_netpark_4_explorer_2_right_available
          start: button.business_durham_netpark_4_explorer_2_right_start_charge
        - name: Explorer 1 Left
          available: binary_sensor.business_durham_netpark_3_explorer_1_left_available
          start: button.business_durham_netpark_3_explorer_1_left_start_charge
        - name: Explorer 1 Right
          available: binary_sensor.business_durham_netpark_3_explorer_1_right_available
          start: button.business_durham_netpark_3_explorer_1_right_start_charge
      free: "{{ candidates | selectattr('available', 'is_state', 'on') | list }}"
  - condition: "{{ free | count > 0 }}"
  - action: notify.mobile_app_YOUR_PHONE
    data:
      title: A charger has freed up
      message: >-
        {{ free[0].name }} is free{% if free | count > 1 %}
        ({{ free | count }} sockets free){% endif %}. Start charging?
      data:
        # Same tag as the arrival notification: a newer one replaces the older.
        tag: mer_work_charger
        actions:
          - action: MER_START_CHARGE
            title: "Start {{ free[0].name }}"
        action_data:
          start_button: "{{ free[0].start }}"
          name: "{{ free[0].name }}"
mode: single

---
# --------------------------------------------------------------------------------------
# 3. Handle the "Start" tap on either notification
# --------------------------------------------------------------------------------------
alias: "Mer: start charge from notification"
description: Press the start button the notification named, or say the socket was taken.
triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: MER_START_CHARGE
actions:
  - variables:
      start_button: "{{ trigger.event.data.action_data.start_button }}"
      name: "{{ trigger.event.data.action_data.name }}"
  - choose:
      # The button is unavailable when the socket is no longer free or already
      # charging, and Home Assistant would silently skip the press.
      - conditions: "{{ states(start_button) == 'unavailable' }}"
        sequence:
          - action: notify.mobile_app_YOUR_PHONE
            data:
              title: Too late
              message: "{{ name }} is no longer free."
              data:
                tag: mer_work_charger
    default:
      - action: notify.mobile_app_YOUR_PHONE
        data:
          message: "Starting {{ name }}..."
          data:
            tag: mer_work_charger
      # Holds until the charger confirms; the outcome arrives via automation 4.
      - action: button.press
        target:
          entity_id: "{{ start_button }}"
        continue_on_error: true
mode: queued

---
# --------------------------------------------------------------------------------------
# 4. Report every start/stop outcome; clear the "free charger" notice once charging
# --------------------------------------------------------------------------------------
alias: "Mer: report command outcome"
description: Notify the result of any start or stop, from the app, a dashboard or an automation.
triggers:
  - trigger: event
    event_type: mer_command_result
actions:
  - variables:
      outcome: >-
        {% set r = trigger.event.data.result %}
        {{ {
          'charging': 'Charging',
          'awaiting_cable': 'Ready, plug the cable in now',
          'stopped': 'Stopped',
          'rejected': 'Rejected by Mer',
          'unconfirmed': 'Accepted but not confirmed yet, check the charger',
        }[r] if r in ['charging', 'awaiting_cable', 'stopped', 'rejected', 'unconfirmed'] else r }}
  - action: notify.mobile_app_YOUR_PHONE
    data:
      title: >-
        {{ trigger.event.data.command | capitalize }} on
        {{ trigger.event.data.station_name }} {{ trigger.event.data.socket_name }}
      message: >-
        {{ outcome }}{% if trigger.event.data.message %}: {{ trigger.event.data.message }}{% endif %}
      data:
        tag: mer_command
  - if: "{{ trigger.event.data.result == 'charging' }}"
    then:
      - action: notify.mobile_app_YOUR_PHONE
        data:
          message: clear_notification
          data:
            tag: mer_work_charger
mode: queued
